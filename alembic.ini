# Used only for authoring migrations:  alembic revision --autogenerate -m "..."
# Applying migrations is done with:    dealradar db upgrade   (takes a backup + the writer lock)
# The database URL comes from DEALRADAR_DATA_DIR (see dealradar/core/config.py).
[alembic]
script_location = dealradar/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
