# Security-relevant settings are set explicitly (ADR-020); do not rely on Streamlit defaults.
[server]
address = "127.0.0.1"
port = 8501
headless = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false
serverAddress = "127.0.0.1"

[client]
# Hide the "Deploy" button (it links to an external hosting service).
toolbarMode = "viewer"

# Visual design (ADR-057): one calm, high-contrast palette; colours carry meaning only
# (green = good / actual money, blue = action, orange = needs review, red = loss / blocked).
[theme]
base = "light"
primaryColor = "#1D5FA8"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F5F8"
textColor = "#18212B"
linkColor = "#1D5FA8"
linkUnderline = false
borderColor = "#DCE1E8"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "0.6rem"
buttonRadius = "0.5rem"
baseFontSize = 15
headingFontWeights = [650, 600, 600, 600, 600, 600]
metricValueFontSize = "1.55rem"
metricValueFontWeight = 600
dataframeHeaderBackgroundColor = "#F3F5F8"
greenColor = "#1E7A4C"
blueColor = "#1D5FA8"
orangeColor = "#B45F06"
redColor = "#B42318"
grayColor = "#5B6675"
chartCategoricalColors = ["#1D5FA8", "#1E7A4C", "#B45F06", "#6E59A5", "#5B6675"]

[theme.sidebar]
backgroundColor = "#F3F5F8"
